name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # make check: байт-компилирует все модули и запускает smoke_test.py.
      # smoke_test мокает БД, Telegram и Google Sheets, поэтому внешние
      # сервисы не нужны.
      - name: Run make check
        run: make check
