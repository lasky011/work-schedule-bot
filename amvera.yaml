# Amvera Cloud: one project, both Telegram bots, Mini App on 8080.
# Region: Warsaw (or Miami). Moscow works via Amvera Telegram proxy, EU is more stable.
# Plan: "Начальный Плюс" (1 GB) — two Python processes need ~400–500 MB.
# Env vars: see .env.example (set them in the Amvera dashboard, not in git).

meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"

build:
  requirementsPath: requirements.txt
  useCache: true

run:
  command: sh deploy/run-both.sh
  containerPort: 8080
